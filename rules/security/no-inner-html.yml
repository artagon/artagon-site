id: no-inner-html
language: typescript
rule:
  # USMR 14.69 (site-2m1.69): all assignment operators and literal indexes.
  all:
    - any:
        - kind: assignment_expression
        - kind: augmented_assignment_expression
    - has:
        field: left
        any:
          - pattern: $OBJ.innerHTML
          - pattern: $OBJ.outerHTML
          - all:
              - pattern: $OBJ[$PROP]
              - has:
                  field: index
                  kind: string
                  regex: ^['"](innerHTML|outerHTML)['"]$
message: "Do not use innerHTML or outerHTML. This can lead to Cross-Site Scripting (XSS) vulnerabilities. Use textContent or safe DOM manipulation instead."
severity: error
