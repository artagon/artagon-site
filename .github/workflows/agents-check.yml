name: Agents folder check
on:
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: agents-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    # USMR 14.82 (site-pep): required checks need unique display names.
    name: agents-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
      - name: Ensure required agent files exist
        run: |
          test -f .agents/AGENT_MANIFEST.yaml
          test -f .agents/llm-config.json
          test -f .agents/policies/guardrails.md
          test -f .agents/context/vision-and-roadmap-full.md
      # add-agent-skills-supply-chain 2.4: skill provenance, integrity and
      # content gate, plus the stack-contract gate behind artagon-stack-guard.
      # Both scripts use only Node built-ins, so no `npm ci` is needed.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with: { node-version-file: .nvmrc }
      - name: Verify agent skills (skills-lock.json)
        run: node scripts/verify-skills.mjs
      - name: Verify stack contract
        run: node scripts/verify-stack.mjs
