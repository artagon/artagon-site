name: Deploy Astro site to Pages
on: { push: { branches: ["main"] }, workflow_dispatch: {} }
# Default permissions are read-only; only the deploy job escalates.
permissions:
  contents: read
concurrency: { group: "pages", cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with: { node-version-file: .nvmrc, cache: "npm" }
      # Use the npm bundled with the runner's Node version (deterministic +
      # avoids unpinned `npm install -g npm@latest` supply-chain surface).
      - name: Install deps (frozen lockfile)
        run: npm ci
      - name: Build site
        run: npm run build
      # USMR 14.51 R1: purge HTML plus non-content-hashed assets outside _astro/.
      - name: Prepare cache purge URLs
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, statSync, mkdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { BUILD } from './build.config.ts';
          const urls = new Set();
          let htmlCount = 0;
          for (const file of readdirSync(BUILD.dist, { recursive: true })) {
            if (file.startsWith('_astro/') || !statSync(join(BUILD.dist, file)).isFile()) continue;
            if (file.endsWith('.html')) htmlCount++;
            const path = file.split('/').map(encodeURIComponent).join('/');
            urls.add(new URL(path, 'https://artagon.com/').href);
            if (path === 'index.html' || path.endsWith('/index.html')) {
              const route = path.slice(0, -'index.html'.length);
              urls.add(new URL(route, 'https://artagon.com/').href);
              if (route) urls.add(new URL(route.slice(0, -1), 'https://artagon.com/').href);
            }
          }
          if (!htmlCount) throw new Error('No HTML URLs found for cache purge');
          mkdirSync(BUILD.reports.cloudflarePurge, { recursive: true });
          writeFileSync(join(BUILD.reports.cloudflarePurge, 'urls.json'), JSON.stringify([...urls].sort()));
          NODE
      - name: Upload cache purge URLs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-purge-urls
          path: .build/reports/cloudflare-purge/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: ./.build/dist }
  deploy:
    needs: build
    # USMR 14.51 (site-2m1.51): bound API and deployment waits.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download cache purge URLs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cloudflare-purge-urls
          path: purge-urls

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      # USMR 14.42 (site-2m1.42): GH Pages soak-window-only purge.
      # Use CLOUDFLARE_CACHE_PURGE_TOKEN (Zone.Cache Purge on the DNS
      # zone) and CLOUDFLARE_DNS_ZONE_ID. Keep these separate from the
      # dedicated Pages account's CLOUDFLARE_API_TOKEN. Retire this step
      # and its two secrets after the migration's seven-day soak window.
      # A successful purge does not prove that origin HTML has propagated.
      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_DNS_ZONE_ID: ${{ secrets.CLOUDFLARE_DNS_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_CACHE_PURGE_TOKEN:-}" ] || [ -z "${CLOUDFLARE_DNS_ZONE_ID:-}" ]; then
            echo "::warning::Cloudflare cache purge skipped: soak-window purge secrets are missing."
            echo "Cloudflare purge skipped; stale HTML may remain cached. Configure CLOUDFLARE_CACHE_PURGE_TOKEN and CLOUDFLARE_DNS_ZONE_ID." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and startswith("https://artagon.com/"))' purge-urls/urls.json > /dev/null; then
            echo "::error::Invalid cache purge manifest."
            exit 1
          fi
          # Small batches keep each request bounded; jq also safely quotes URLs.
          jq -c '[range(0; length; 10) as $i | {files: .[$i:$i+10]}][]' purge-urls/urls.json > purge-urls/batches.jsonl
          while IFS= read -r payload; do
            response=$(curl --silent --show-error --fail --connect-timeout 10 --max-time 60 \
              -X POST \
              "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_DNS_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_CACHE_PURGE_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$payload")
            if ! printf '%s' "$response" | jq -e '.success == true' > /dev/null; then
              echo "::error::Cloudflare rejected the cache purge."
              exit 1
            fi
          done < purge-urls/batches.jsonl
          echo "Cloudflare cache purge accepted." >> "$GITHUB_STEP_SUMMARY"
