name: Actionlint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/workflows/actionlint.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/workflows/actionlint.yml"

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify ShellCheck
        run: shellcheck --version

      - name: Download actionlint archive
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"

      - name: Verify actionlint archive checksum
        run: |
          set -euo pipefail
          # SHA-256 from actionlint_1.7.12_checksums.txt in the rhysd/actionlint v1.7.12 release.
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | sha256sum --check

      - name: Extract actionlint
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -C "$RUNNER_TEMP" actionlint
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint -no-color .github/workflows/*.yml
