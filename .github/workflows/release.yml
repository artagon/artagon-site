name: Release bundle
on:
  push:
    tags: ["v*.*.*", "v*.*", "v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.0.0
        with: { node-version-file: .nvmrc, cache: "npm" }
      - name: Install deps (frozen lockfile)
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Zip dist bundle
        run: cd .build/dist && zip -r ../../artagon-site-dist.zip .
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artagon-site-dist.zip
          generate_release_notes: true
