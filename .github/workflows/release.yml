name: Release bundle
on:
  push:
    tags: ["v*.*.*", "v*.*", "v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with: { node-version: 22, cache: "npm" }
      - name: Install deps (frozen lockfile)
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Zip dist bundle
        run: cd .build/dist && zip -r ../../artagon-site-dist.zip .
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artagon-site-dist.zip
          generate_release_notes: true
