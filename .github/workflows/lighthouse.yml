name: Lighthouse CI
on:
  pull_request: {}
  push:
    branches: ["main"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lhci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with: { node-version: 22, cache: "npm" }
      - name: Install deps (frozen lockfile)
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Run Lighthouse CI
        run: npx lhci autorun --config=lighthouserc.json
