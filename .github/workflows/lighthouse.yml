name: Lighthouse CI
on:
  pull_request: {}
  push:
    branches: ["main"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lhci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.0.0
        with: { node-version-file: .nvmrc, cache: "npm" }
      - name: Install deps (frozen lockfile)
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Run Lighthouse CI
        run: npx lhci autorun --config=lighthouserc.json
