# Dependabot configuration — keeps GitHub Actions SHA pins fresh and
# bumps npm devDeps on a weekly schedule. Required by
# the standardize-build-artifacts spec (archived 2026-05-05 to
# openspec/changes/archive/2026-05-05-standardize-build-artifacts/;
# Sync Generator and Drift Gate Requirement) so the SHA-pin
# enforcement gate has an upgrade path.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
    reviewers:
      - "@artagon/owners"
    commit-message:
      prefix: "chore(actions)"
      include: scope

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    groups:
      # USMR 14.83 (site-o6a): keep the React runtime and type packages
      # together; this must precede dev-deps because the first matching group wins.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # USMR 14.88 (site-yy1): Astro and its integrations move together,
      # majors included, so peer ranges never split across PRs.
      astro:
        patterns: ["astro", "@astrojs/*"]
      dev-deps:
        dependency-type: development
    open-pull-requests-limit: 5
    reviewers:
      - "@artagon/owners"
    commit-message:
      prefix: "chore(deps)"
      include: scope
    ignore:
      # USMR 14.88: React, Astro and @astrojs/* majors are no longer held back;
      # they arrive through the react and astro groups above.
      # site-xt4: TypeScript 7 still hits ERESOLVE because @astrojs/check
      # 0.9.12 accepts TypeScript ^5 || ^6 only. Remove this when it widens.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # Playwright 1.x → 2.x needs a human reviewer per the build-config
      # capability spec (openspec/specs/build-config/spec.md).
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-major"]
